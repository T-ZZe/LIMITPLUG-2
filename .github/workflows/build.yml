name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "LimitPlugin (1)/LimitPlugin"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: LimitPlugin
          path: "LimitPlugin (1)/LimitPlugin/target/LimitPlugin-1.0.jar"
